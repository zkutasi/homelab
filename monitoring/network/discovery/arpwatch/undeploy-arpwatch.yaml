- name: Disable the interface-specific service
  hosts: networkmonitoring
  become: true
  tasks:
    - name: Disable and stop arpwatch service
      ansible.builtin.systemd_service:
        name: "arpwatch@{{ arpwatch_interface }}.service"
        state: stopped
        enabled: false
- name: Delete arpwatch
  hosts: networkmonitoring
  roles:
    - package-remove
  vars:
    packages:
      - arpwatch
- name: Delete the arpwatch data
  hosts: networkmonitoring
  become: true
  tasks:
    - name: Remove the arpwatch database
      ansible.builtin.file:
        path: /var/lib/arpwatch
        state: absent
