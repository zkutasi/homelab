- name: Deploy fastfetch
  hosts: linux-selfmanaged
  roles:
    - binary-install
  become: true
  vars:
    requested_binary_repo_version: "fastfetch-cli/fastfetch:2.68.1"
    binary_repository: "{{ requested_binary_repo_version.split(':')[0] }}"
    requested_binary_version: "{{ requested_binary_repo_version.split(':')[1] }}"
    bin_filename: fastfetch
    bin_path: /usr/bin
    arch_map:
      x86_64: amd64
      aarch64: aarch64
      arm64: aarch64
    arch: "{{ arch_map.get(ansible_architecture, ansible_architecture) }}"
    download_url: https://github.com/{{ binary_repository }}/releases/download/{{
      requested_binary_version }}/fastfetch-linux-{{ arch }}.deb
    compressed: false
    install_cmd: "dpkg --install ./\
      fastfetch-linux-{{ arch }}.deb"
- name: Add the inclusion of fastfetch in the bashrc file
  hosts: linux-selfmanaged
  tasks:
    - name: Add the inclusion of fastfetch in the bashrc file
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: 'fastfetch'
        state: present
        create: true
- name: Template the fastfetch configuration file
  hosts: linux-selfmanaged
  tasks:
    - name: Ensure the .config directory exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config/fastfetch"
        state: directory
    - name: Template the fastfetch configuration file
      ansible.builtin.template:
        src: "all/fastfetch.config.jsonc.j2"
        dest: "{{ ansible_user_dir }}/.config/fastfetch/config.jsonc"
