- name: Configure Alloy
  hosts: proxmox
  tasks:
    - name: Create config.alloy from template
      ansible.builtin.template:
        # The host and Docker variants share one configuration
        src: ../docker/config/templates/config/config.alloy.j2
        dest: "/etc/alloy/config.alloy"
        mode: '0644'
        owner: root
        group: root
      notify: Restart alloy
  handlers:
    - name: Restart alloy
      ansible.builtin.systemd_service:
        name: "alloy"
        state: restarted
        enabled: true
