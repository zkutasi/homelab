- name: Copy all required scripts
  hosts: linux
  vars:
    scripts_ownership_user: "{{ ansible_user }}"
    scripts_ownership_group: users
  tasks:
    - name: Copy scripts to the host they belong to
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ ansible_user_dir }}"
        owner: "{{ scripts_ownership_user }}"
        group: "{{ scripts_ownership_group }}"
        mode: "0755"
      # Files of every group the host is in, plus the host's own folder
      loop: "{{ query('ansible.builtin.fileglob', *((group_names + [inventory_hostname]) | map('regex_replace', '^(.*)$', playbook_dir + '/files/\\1/*') | list)) }}"
    - name: Template scripts to the host they belong to
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ ansible_user_dir }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: "{{ scripts_ownership_user }}"
        group: "{{ scripts_ownership_group }}"
        mode: "0755"
      loop: "{{ query('ansible.builtin.fileglob', *((group_names + [inventory_hostname]) | map('regex_replace', '^(.*)$', playbook_dir + '/templates/\\1/*') | list)) }}"
