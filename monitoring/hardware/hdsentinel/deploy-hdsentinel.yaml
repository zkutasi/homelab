- name: Deploy HDSentinel as binary
  hosts: smart
  pre_tasks:
    - name: Ensure the HDSentinel folder exists
      when: "'synology' not in group_names"
      ansible.builtin.file:
        path: "{{ hdsentinel_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
  roles:
    - binary-install
  become: true
  vars:
    requested_binary_version: "0.20c"
    bin_filename: HDSentinel
    bin_path: "{{ hdsentinel_dir }}"
    download_url: "https://www.hdsentinel.com/hdslin/hdsentinel-{{ requested_binary_version | replace('.', '') }}-x64.zip"
    # The role's defaults are tar options; the zip holds the binary at its top level
    decompression_options: []
    version_flag: "-h"
