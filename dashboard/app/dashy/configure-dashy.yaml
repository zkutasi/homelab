- name: Generate dynamic configuration for Dashy for K8s services
  hosts: dashboard
  gather_facts: false
  tasks:
    - name: Gather Contour HTTPProxy resources
      kubernetes.core.k8s_info:
        kubeconfig: "/runner/.kube/config"
        api_version: projectcontour.io/v1
        kind: HTTPProxy
      delegate_to: localhost
      register: contour_proxies
    - name: Filter HTTPProxy resources exposing a virtualhost FQDN
      ansible.builtin.set_fact:
        contour_endpoints: >-
          {{
            contour_proxies.resources
            | selectattr('spec.virtualhost.fqdn', 'defined')
            | list
            | sort(attribute='spec.virtualhost.fqdn')
          }}
- name: Generate dynamic configuration for Dashy
  hosts: dashboard
  tasks:
    - name: Generate configuration file from template
      ansible.builtin.template:
        src: config/templates/config/conf.yml.j2
        dest: "{{ ansible_user_dir }}/docker-compose/dashy/config/conf.yml"
