version: 3
dependencies:
  ansible_core:
    package_pip: ansible-core<2.18
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  galaxy:
    # The collections are capped to majors that still support the ansible-core pin above; lift them together with it
    collections:
      - name: community.crypto
        type: galaxy
        version: ">=3.0.0,<4.0.0"
      - name: community.docker
        type: galaxy
        version: ">=5.0.0,<6.0.0"
      - name: community.general
        type: galaxy
        version: ">=12.0.0,<13.0.0"
      - name: kubernetes.core
        type: galaxy
        version: ">=6.0.0,<7.0.0"
    roles:
      - name: simoncaron.pve_permissions
        type: galaxy
  python:
    - ansible-lint
    - dnspython
    - jmespath
    - passlib
    - pypsrp
  python_interpreter:
    package_system: "python312"
    python_path: "/usr/bin/python3.12"

images:
  base_image:
    name: ghcr.io/ansible-community/community-ee-base:2.21.5-2@sha256:d42f2597080e8e34ce4d1f70f66f987fc841bd0bbeb680f8d234e94ef1afc60a
