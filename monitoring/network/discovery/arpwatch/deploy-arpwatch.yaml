- name: Deploy arpwatch on the host
  hosts: networkmonitoring
  become: true
  roles:
    - package-install
  vars:
    packages:
      - arpwatch
- name: Enable the interface-specific service
  hosts: networkmonitoring
  become: true
  tasks:
    # Check mode doesn't install the package, so systemd can't know its unit yet
    - name: Look for arpwatch's unit
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/arpwatch@.service
      register: arpwatch_unit
    - name: Enable and start arpwatch service
      when: not (ansible_check_mode and not arpwatch_unit.stat.exists)
      ansible.builtin.systemd_service:
        name: "arpwatch@{{ arpwatch_interface }}.service"
        state: started
        enabled: true
