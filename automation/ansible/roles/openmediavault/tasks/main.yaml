# Each area lives in its own file and has its own tag, so one area can be run alone,
# e.g. --tags nfs. The disk list is tagged always, as every later area needs its facts.
- name: Check the input data
  ansible.builtin.import_tasks: validate.yaml
  tags: always
- name: OMV system settings (notifications, OMV-Extras, Docker)
  ansible.builtin.import_tasks: system.yaml
  tags: system
- name: Build the list of available disks
  ansible.builtin.import_tasks: disks.yaml
  tags: always
- name: Filesystem mounts
  ansible.builtin.import_tasks: mounts.yaml
  tags: mounts
- name: Symlinks
  ansible.builtin.import_tasks: symlinks.yaml
  tags: symlinks
- name: Shared folders
  ansible.builtin.import_tasks: shared-folders.yaml
  tags: sharedfolders
- name: SnapRAID
  ansible.builtin.import_tasks: snapraid.yaml
  tags: snapraid
- name: MergerFS pools
  ansible.builtin.import_tasks: mergerfs.yaml
  tags: mergerfs
- name: NFS shares
  ansible.builtin.import_tasks: nfs.yaml
  tags: nfs
- name: Samba shares
  ansible.builtin.import_tasks: samba.yaml
  tags: samba
