- name: Provide the fake Python packages
  ansible.builtin.import_playbook: ../../../../../../tests/molecule/pipx-fixtures.yml
- name: Install the older version, then publish the newer one
  hosts: all
  gather_subset:
    - min
  # pip installs only the fake packages, from the local folder
  environment:
    PIP_NO_INDEX: "1"
    PIP_FIND_LINKS: /srv/pipx/current
  roles:
    - role: package-install-pipx
      vars:
        pipx_packages:
          - fake-tool==1.0.0
  post_tasks:
    - name: Publish fake-tool 2.0.0
      ansible.builtin.copy:
        src: /srv/pipx/next/
        dest: /srv/pipx/current/
        remote_src: true
        mode: preserve
