global:
  dnsService: coredns
loki:
  compactor:
    delete_request_store: s3
    retention_enabled: true
    working_directory: /var/loki/compactor
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  pattern_ingester:
    enabled: true
  ruler:
    enable_api: true
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
  structuredConfig:
    storage_config:
      aws:
        endpoint: 'http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:8333'
        s3forcepathstyle: true
        insecure: true
      named_stores:
        aws:
          seaweedfs:
            endpoint: 'http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:8333'
            bucketnames: loki-chunks
            s3forcepathstyle: true
            insecure: true
    schema_config:
      configs:
        - from: "2026-05-01"
          store: tsdb
          object_store: seaweedfs
          schema: v13
          index:
            prefix: index_
            period: 24h

deploymentMode: Monolithic

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
  alerts:
    enabled: true
  serviceMonitor:
    enabled: true
