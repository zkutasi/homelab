- name: Install the binary
  when: requested_binary_version | length > 0
  block:
    - name: Check if the binary is present
      ansible.builtin.stat:
        path: "{{ bin_path }}/{{ bin_filename }}"
      register: binary_filestat
    - name: Set a default for the installed version
      ansible.builtin.set_fact:
        binary_installed_version: ""
    - name: Check the version of the binary if present
      when: binary_filestat.stat.exists and not binary_filestat.stat.isdir and version_flag
      check_mode: false
      block:
        - name: Check the version of the binary if present
          ansible.builtin.command:
            cmd: "{{ bin_path }}/{{ bin_filename }} {{ version_flag }}"
          register: binary_installed_version_output
          changed_when: false
        - name: Extract exact version
          ansible.builtin.set_fact:
            binary_installed_version: "{{ ((binary_installed_version_output.stdout_lines + binary_installed_version_output.stderr_lines) | join('\n')
              | regex_search('v?([0-9]+(?:\\.[0-9]+)+(?:[a-z](?![a-z0-9]))?)', '\\1') or ['']) | first | string }}"
        - name: Make sure the version could be read
          ansible.builtin.assert:
            that: binary_installed_version | length > 0
            fail_msg: >-
              Could not find a version number in the output of
              '{{ bin_path }}/{{ bin_filename }} {{ version_flag }}'. Fix version_flag,
              or set it to "" if the binary has no version information.
            quiet: true
        - name: Print out the binary version
          ansible.builtin.debug:
            var: binary_installed_version
    - name: Download the given version of binary if not already installed
      when: not binary_filestat.stat.exists or requested_binary_version != binary_installed_version
      notify: Restart the service
      block:
        - name: Debug the input data
          ansible.builtin.debug:
            msg: "Downloading {{ bin_filename }} version {{ requested_binary_version }} from {{ download_url }}"
        # The installer needs its temporary folder and runs a command, neither of which happens in check mode,
        # so the planned install is reported instead
        - name: Report the installer run that check mode skips
          when: install_cmd | length > 0 and ansible_check_mode
          ansible.builtin.debug:
            msg: "{{ bin_filename }} {{ requested_binary_version }} would be installed with: {{ install_cmd }}"
          changed_when: true
        - name: Download and execute installer
          when: install_cmd | length > 0 and not ansible_check_mode
          block:
            - name: Create temporary directory for installer {{ bin_filename }}
              ansible.builtin.tempfile:
                state: directory
                suffix: "{{ bin_filename }}"
              register: installer_tmpdir
            - name: Download and extract also if required
              block:
                - name: Download and extract the installer
                  ansible.builtin.unarchive:
                    src: "{{ download_url }}"
                    remote_src: true
                    dest: "{{ installer_tmpdir.path }}"
                  when: compressed
                - name: Download the installer
                  ansible.builtin.get_url:
                    url: "{{ download_url }}"
                    dest: "{{ installer_tmpdir.path }}"
                    mode: '0755'
                    owner: root
                    group: root
                  when: not compressed
            - name: Run installer {{ bin_filename }}
              ansible.builtin.command:
                cmd: "{{ install_cmd }}"
                chdir: "{{ installer_tmpdir.path }}"
              changed_when: true
            - name: Clean up temp directory
              ansible.builtin.file:
                path: "{{ installer_tmpdir.path }}"
                state: absent
        - name: Download and extract also if required
          when: install_cmd | length == 0
          become: true
          block:
            - name: Download and extract the binary
              when: compressed
              block:
                - name: Download and extract the binary
                  become: true
                  ansible.builtin.unarchive:
                    src: "{{ download_url }}"
                    remote_src: true
                    dest: "{{ bin_path }}"
                    extra_opts: "{{ decompression_options }}"
                    mode: '0755'
                    owner: root
                    group: root
                  register: binary_unarchive
                # Check mode skips unarchive for tar archives, and for zips without unzip on the host,
                # so the planned install is reported here instead
                - name: Report the install that check mode skipped
                  when: binary_unarchive is skipped
                  ansible.builtin.debug:
                    msg: "{{ bin_filename }} {{ requested_binary_version }} would be installed ({{ binary_unarchive.msg }})"
                  changed_when: true
              # unarchive needs unzip or tar on the host; a host that has neither but ships 7z (like a NAS appliance)
              # gets the binary extracted with 7z instead. This works for archives holding the binary at their top
              # level, like a zip; 7z unpacks only one layer of a .tar.gz at a time.
              rescue:
                - name: Fail on anything else than a missing extractor
                  ansible.builtin.fail:
                    msg: "{{ ansible_failed_result.msg }}"
                  when: ansible_failed_result.msg is not search('Failed to find handler')
                - name: Create a temporary folder for the archive
                  ansible.builtin.tempfile:
                    state: directory
                    suffix: "{{ bin_filename }}"
                  register: binary_archive_tmpdir
                - name: Download the archive
                  ansible.builtin.get_url:
                    url: "{{ download_url }}"
                    dest: "{{ binary_archive_tmpdir.path }}/{{ download_url | basename }}"
                    mode: '0644'
                # iso_extract only runs `7z x` on the file, which reads any archive format 7z knows, not just ISO images
                - name: Extract the binary with 7z
                  community.general.iso_extract:
                    image: "{{ binary_archive_tmpdir.path }}/{{ download_url | basename }}"
                    dest: "{{ bin_path }}"
                    files:
                      - "{{ bin_filename }}"
                    executable: 7z
                - name: Set the mode and owner of the binary
                  ansible.builtin.file:
                    path: "{{ bin_path }}/{{ bin_filename }}"
                    mode: '0755'
                    owner: root
                    group: root
                - name: Remove the temporary folder
                  ansible.builtin.file:
                    path: "{{ binary_archive_tmpdir.path }}"
                    state: absent
            - name: Download the binary
              become: true
              ansible.builtin.get_url:
                url: "{{ download_url }}"
                dest: "{{ bin_path if destination_path | length == 0 else destination_path }}"
                mode: '0755'
                owner: root
                group: root
              when: not compressed
- name: Create a new Service for the binary if requested
  become: true
  ansible.builtin.template:
    src: service.j2
    dest: "{{ service_path }}/{{ service_name }}.service"
    mode: '0644'
    owner: root
    group: root
  notify: Restart the service
  register: binary_service_unit
  when: service_name | length > 0
# Check mode doesn't write the unit file, so systemd can't know a new service yet
- name: Start the service
  become: true
  ansible.builtin.systemd_service:
    daemon_reexec: true
    daemon_reload: true
    name: "{{ service_name }}"
    state: started
    enabled: true
  when: service_name | length > 0 and not (ansible_check_mode and binary_service_unit is changed)
