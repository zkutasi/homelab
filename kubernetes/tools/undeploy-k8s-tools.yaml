- name: Delete kubectl tools
  hosts: controlserver
  become: true
  tasks:
    - name: "Remove binary"
      ansible.builtin.include_role:
        name: binary-remove
      loop:
        - kubectl
        - helm
        - kustomize
        - kompose
        - kubeconform
        - oras
        - k9s
        - kor
        - kube-linter
        - kube-score
        - kubectx
        - kubens
        - kubescape
        - kubetail
        - pluto
        - popeye
      loop_control:
        loop_var: bin_filename
- name: Delete krew and all plugins
  hosts: controlserver
  become: false
  tasks:
    - name: Remove .krew folder
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.krew"
        state: absent
- name: Remove the shell integration
  hosts: controlserver
  become: false
  tasks:
    - name: Remove the autocompletion lines
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        regexp: '#?\s*source <\({{ item }} completion bash\).*'
        state: absent
      loop:
        - kubectl
        - helm
        - kompose
    - name: Remove the krew path
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        regexp: '#?\s*export PATH="\${KREW_ROOT:-\$HOME/\.krew}/bin:\$PATH".*'
        state: absent
