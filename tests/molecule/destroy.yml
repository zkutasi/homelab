- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove the targets
      community.docker.docker_container:
        name: "{{ item.name }}"
        state: absent
        force_kill: true
        keep_volumes: false
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
