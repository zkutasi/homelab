- name: Case a user without a key
  hosts: all
  gather_subset:
    - min
  roles:
    - ssh-keys
  post_tasks:
    - name: Read the generated key
      ansible.builtin.slurp:
        src: /home/tester/.ssh/id_ed25519.pub
      register: generated
    - name: Check the role returns the generated key
      ansible.builtin.assert:
        that: ssh_public_key == generated.content | b64decode
        quiet: true
# The same host as the first case, so the role's facts from that run are still there
- name: Case a user with an RSA key, right after the first case on the same host
  hosts: all
  gather_subset:
    - min
  vars:
    ansible_user: bob
  roles:
    - ssh-keys
  post_tasks:
    - name: Read the existing key
      ansible.builtin.slurp:
        src: /home/bob/.ssh/id_rsa.pub
      register: existing
    - name: Check the role returns the existing key
      ansible.builtin.assert:
        that: ssh_public_key == existing.content | b64decode
        quiet: true
