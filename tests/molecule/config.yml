dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: ubuntu-24.04
    image: homelab-molecule:testing
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      # Docker mounts a tmpfs noexec by default; installers run from their temporary folder there, as on the hosts
      - /tmp:exec
provisioner:
  name: ansible
  # Our own create and destroy: the driver's poll with a 5 s delay and run steps we don't use
  playbooks:
    create: ${MOLECULE_PROJECT_DIRECTORY}/../../../../tests/molecule/create.yml
    destroy: ${MOLECULE_PROJECT_DIRECTORY}/../../../../tests/molecule/destroy.yml
  # The execution environment has the Docker SDK but no docker CLI
  connection_options:
    ansible_connection: community.docker.docker_api
    # The deploying user of the image, like on the hosts: a normal user with sudo
    ansible_user: tester
  env:
    # The repository's settings, like a real run (jinja2_native above all); its profiling callbacks stay off,
    # replaced by the stdout callback it has anyway, as an empty list makes Ansible warn on every run
    ANSIBLE_CONFIG: ${MOLECULE_PROJECT_DIRECTORY}/../../../../ansible.cfg
    ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.default
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_PIPELINING: "true"
verifier:
  name: ansible
