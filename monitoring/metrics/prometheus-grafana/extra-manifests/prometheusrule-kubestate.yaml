apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  groups:
    - name: KubestateExporter
      rules:
        - alert: KubernetesStatefulSetDown
          expr: kube_statefulset_replicas > 0 and kube_statefulset_replicas != kube_statefulset_status_replicas_ready and changes(kube_statefulset_status_replicas_updated[10m]) == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes StatefulSet down
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} went down"
        - alert: KubernetesContainerOomKiller
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Container oom killer
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes."
        - alert: KubernetesCronJobTooLong
          expr: kube_job_status_start_time > 0 and absent(kube_job_status_completion_time) and (time() - kube_job_status_start_time) > 3600
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes CronJob too long
            description: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is taking more than 1h to complete."
        - alert: KubernetesNodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Node memory pressure
            description: "Node {{ $labels.node }} has MemoryPressure condition"
        - alert: KubernetesNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Node disk pressure
            description: "Node {{ $labels.node }} has DiskPressure condition"
        - alert: KubernetesVolumeOutOfDiskSpace
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 10 and kubelet_volume_stats_capacity_bytes > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Volume out of disk space
            description: "Volume is almost full (< 10% left)"
        - alert: KubernetesVolumeInodesFullInFourDays
          expr: predict_linear(kubelet_volume_stats_inodes_free[6h:5m], 4 * 24 * 3600) < 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Volume inodes full in four days
            description: "PersistentVolume claimed by {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is expected to run out of free inodes within four days at the current rate."
        - alert: KubernetesVolumeOutOfInodes
          expr: kubelet_volume_stats_inodes_free / kubelet_volume_stats_inodes < 0.03 and kubelet_volume_stats_inodes > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Volume out of inodes
            description: "PersistentVolume claimed by {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 3% of its inodes free. A volume can run out of inodes (too many small files) even while free bytes remain available."
        - alert: KubernetesNodeNetworkUnavailable
          expr: kube_node_status_condition{condition="NetworkUnavailable",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Node network unavailable
            description: "Node {{ $labels.node }} has NetworkUnavailable condition"
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Node not ready
            description: "Node {{ $labels.node }} has been unready for a long time"
        - alert: KubernetesCronJobFailing
          expr: (kube_cronjob_status_last_schedule_time > kube_cronjob_status_last_successful_time) AND (kube_cronjob_status_active == 0) AND (kube_cronjob_spec_suspend == 0)
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes CronJob failing
            description: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is failing"
        - alert: KubernetesPersistentVolumeError
          expr: kube_persistentvolume_status_phase{phase=~"Failed|Pending"} > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes PersistentVolume error
            description: "Persistent volume {{ $labels.persistentvolume }} is in bad state"
        - alert: KubernetesPodNotHealthy
          expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Pod not healthy
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-running state for longer than 15 minutes."
        - alert: KubernetesDeploymentGenerationMismatch
          expr: kube_deployment_status_observed_generation != kube_deployment_metadata_generation
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Deployment generation mismatch
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has failed but has not been rolled back."
        - alert: KubernetesStatefulSetGenerationMismatch
          expr: kube_statefulset_status_observed_generation != kube_statefulset_metadata_generation
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes StatefulSet generation mismatch
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has failed but has not been rolled back."
        - alert: KubernetesJobSlowCompletion
          expr: kube_job_spec_completions - kube_job_status_succeeded - kube_job_status_failed > 0
          for: 12h
          labels:
            severity: critical
          annotations:
            summary: Kubernetes Job slow completion
            description: "Kubernetes Job {{ $labels.namespace }}/{{ $labels.job_name }} did not complete in time."
        - alert: KubernetesAPIServerErrors
          expr: sum(rate(apiserver_request_total{job="apiserver",code=~"(?:5..)"}[1m])) by (instance, job) / sum(rate(apiserver_request_total{job="apiserver"}[1m])) by (instance, job) * 100 > 3 and sum(rate(apiserver_request_total{job="apiserver"}[1m])) by (instance, job) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes API server errors
            description: "Kubernetes API server is experiencing {{ $value | humanize }}% error rate"
        - alert: KubernetesAPIClientErrors
          expr: (sum(rate(rest_client_requests_total{code=~"(4|5).."}[1m])) by (instance, job) / sum(rate(rest_client_requests_total[1m])) by (instance, job)) * 100 > 1 and sum(rate(rest_client_requests_total[1m])) by (instance, job) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes API client errors
            description: "Kubernetes API client is experiencing {{ $value | humanize }}% error rate"
        - alert: KubernetesKube-state-metricsList/watchErrors
          expr: (rate(kube_state_metrics_list_total{result="error"}[5m]) / rate(kube_state_metrics_list_total[5m]) > 0.01 and rate(kube_state_metrics_list_total[5m]) > 0) or (rate(kube_state_metrics_watch_total{result="error"}[5m]) / rate(kube_state_metrics_watch_total[5m]) > 0.01 and rate(kube_state_metrics_watch_total[5m]) > 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes kube-state-metrics list/watch errors
            description: "kube-state-metrics is failing to list or watch objects from the Kubernetes API server, which means every other kube-state-metrics-based alert may silently stop firing because its data has gone stale or missing."
        - alert: KubernetesAPIServerTerminatingRequests
          expr: sum(rate(apiserver_request_terminations_total[10m])) / (sum(rate(apiserver_request_total[10m])) + sum(rate(apiserver_request_terminations_total[10m]))) > 0.20
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes API server terminating requests
            description: "The Kubernetes API server is terminating {{ $value | humanizePercentage }} of incoming requests, indicating it is shedding load under overload (e.g. via priority and fairness flow control) rather than just returning error responses."
        - alert: KubernetesNodeOutOfPodCapacity
          expr: sum by (node) ((kube_pod_status_phase{phase="Running"} == 1) + on(uid, instance) group_left(node) (0 * kube_pod_info{pod_template_hash=""})) / sum by (node) (kube_node_status_allocatable{resource="pods"}) * 100 > 90
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Node out of pod capacity
            description: "Node {{ $labels.node }} is out of pod capacity"
        - alert: KubernetesJobFailed
          expr: kube_job_status_failed > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Job failed
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete"
        - alert: KubernetesJobNotStarting
          expr: kube_job_status_active == 0 and kube_job_status_failed == 0 and kube_job_status_succeeded == 0 and (time() - kube_job_status_start_time) > 600
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Job not starting
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} did not start for 10 minutes"
        - alert: KubernetesCronJobSuspended
          expr: kube_cronjob_spec_suspend != 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes CronJob suspended
            description: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} is suspended"
        - alert: KubernetesPersistentVolumeClaimPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes PersistentVolumeClaim pending
            description: "PersistentVolumeClaim {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is pending"
        - alert: KubernetesVolumeFullInFourDays
          expr: predict_linear(kubelet_volume_stats_available_bytes[6h:5m], 4 * 24 * 3600) < 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Volume full in four days
            description: "Volume under {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is expected to fill up within four days. Currently {{ $value | humanize }}% is available."
        - alert: KubernetesPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes pod crash looping
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
        - alert: KubernetesReplicaSetReplicasMismatch
          expr: kube_replicaset_spec_replicas != kube_replicaset_status_ready_replicas
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes ReplicaSet replicas mismatch
            description: "ReplicaSet {{ $labels.namespace }}/{{ $labels.replicaset }} replicas mismatch"
        - alert: KubernetesDeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Deployment replicas mismatch
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} replicas mismatch"
        - alert: KubernetesStatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes StatefulSet replicas mismatch
            description: "StatefulSet does not match the expected number of replicas."
        - alert: KubernetesStatefulSetUpdateNotRolledOut
          expr: max without (revision) (kube_statefulset_status_current_revision unless kube_statefulset_status_update_revision) * (kube_statefulset_replicas != kube_statefulset_status_replicas_updated)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes StatefulSet update not rolled out
            description: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} update has not been rolled out."
        - alert: KubernetesDaemonSetRolloutStuck
          expr: ((kube_daemonset_status_number_ready / kube_daemonset_status_desired_number_scheduled * 100 < 100 and kube_daemonset_status_desired_number_scheduled > 0) or kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_current_number_scheduled > 0) and changes(kube_daemonset_status_updated_number_scheduled[5m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes DaemonSet rollout stuck
            description: "Some Pods of DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} are not scheduled or not ready"
        - alert: KubernetesDaemonSetMisscheduled
          expr: kube_daemonset_status_number_misscheduled > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes DaemonSet misscheduled
            description: "Some Pods of DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} are running where they are not supposed to run"
        - alert: KubernetesAPIServerLatency
          expr: histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{verb!~"(?:CONNECT|WATCHLIST|WATCH|PROXY)"} [10m])) WITHOUT (subresource)) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes API server latency
            description: "Kubernetes API server has a 99th percentile latency of {{ $value }} seconds for {{ $labels.verb }} {{ $labels.resource }}."
        - alert: KubernetesContainerWaiting
          expr: kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Container waiting
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in waiting state for longer than 1 hour, for a reason other than CrashLoopBackOff (e.g. ImagePullBackOff, CreateContainerConfigError, InvalidImageName)."
        - alert: KubernetesDeploymentRolloutStuck
          expr: kube_deployment_status_condition{condition="Progressing",status="false"} != 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes Deployment rollout stuck
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout is not progressing, as reported by its Progressing=false condition."
        - alert: KubernetesPodDisruptionBudgetNotEnoughHealthyPods
          expr: kube_poddisruptionbudget_status_desired_healthy - kube_poddisruptionbudget_status_current_healthy > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes PodDisruptionBudget not enough healthy pods
            description: "PodDisruptionBudget {{ $labels.namespace }}/{{ $labels.poddisruptionbudget }} does not have the desired number of healthy pods, so voluntary disruptions such as node drains or cluster upgrades may be blocked or the application may be under-provisioned during maintenance."
        - alert: KubernetesResourceQuotaExceeded
          expr: kube_resourcequota{type="used"} / ignoring(type) (kube_resourcequota{type="hard"} > 0) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes ResourceQuota exceeded
            description: "Namespace {{ $labels.namespace }} is using more of its {{ $labels.resource }} ResourceQuota than the configured hard limit ({{ $value | humanizePercentage }} of quota), indicating a misconfiguration or inconsistency between actual usage and the enforced quota."
        - alert: KubernetesClientCertificateExpiresSoon
          expr: apiserver_client_certificate_expiration_seconds_count{job="apiserver"} > 0 and histogram_quantile(0.01, sum by (job, le) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver"}[5m]))) < 24*60*60
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes client certificate expires soon
            description: "A client certificate used to authenticate to the apiserver is expiring in less than 24.0 hours."
        - alert: KubernetesClientCertificateExpiresNextWeek
          expr: apiserver_client_certificate_expiration_seconds_count{job="apiserver"} > 0 and histogram_quantile(0.01, sum by (job, le) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver"}[5m]))) < 7*24*60*60
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes client certificate expires next week
            description: "A client certificate used to authenticate to the apiserver is expiring next week."
