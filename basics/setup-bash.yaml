- name: Ensure bash_aliases file exists
  hosts: linux
  tasks:
    - name: Ensure bash_aliases file exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        state: touch
        mode: '0644'
        access_time: preserve
        modification_time: preserve
- name: Read .bash_aliases in interactive shells
  hosts: linux
  tasks:
    - name: Read .bash_aliases in interactive shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: '[[ $- == *i* && -f ~/.bash_aliases ]] && . ~/.bash_aliases'
        mode: "0644"
    - name: Define ll like Ubuntu does
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        line: "alias ll='ls -alF'"
        create: true
        mode: "0644"
- name: Put ~/.local/bin on the PATH
  hosts: linux
  tasks:
    - name: Add ~/.local/bin to PATH in login shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.profile"
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        mode: "0644"
- name: Set up the dashboard's login shell
  hosts: displayscreen
  tasks:
    - name: Read .profile in login shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: '[ -f ~/.profile ] && . ~/.profile'
        insertbefore: BOF
        create: true
        mode: "0644"
    - name: Start X on the first console
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && startx'
        create: true
        mode: "0644"
- name: Let login shells follow the distro's .profile
  hosts:
    - proxmox
    - openmediavault
  tasks:
    # Without it, login shells follow the distro's .profile like on any Debian host
    - name: Remove .bash_profile
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.bash_profile"
        state: absent
