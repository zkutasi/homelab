    - name: Ensure .bash_aliases is present
      ansible.builtin.template:
        src: "proxmox/bash_aliases.j2"
        dest: "{{ ansible_user_dir }}/.bash_aliases"
        owner: "{{ ansible_user }}"
        group: "users"
        mode: '0644'
