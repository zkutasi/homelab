- name: Set up /etc/hosts for media
  hosts: mediaserver
  become: true
  roles:
    - hosts
  vars:
    hosts_dns_server: "@{{ hostvars[groups['dnsserver'][0]].ansible_host }}"
    hosts_entries:
      - "omv.{{ network_domain }}"
      - "synology216.{{ network_domain }}"
- name: Set up /etc/hosts for monitoring
  hosts:
    - standalone
    # - synology
    - proxmox
  become: true
  roles:
    - hosts
  vars:
    hosts_dns_server: "@{{ hostvars[groups['dnsserver'][0]].ansible_host }}"
    hosts_entries:
      - "loki.{{ kubernetes_internal_domain }}"
      - "prometheus.{{ kubernetes_internal_domain }}"
      - "influxdb.{{ kubernetes_internal_domain }}"
      - "pulse.{{ kubernetes_internal_domain }}"
      - "beszel.{{ kubernetes_internal_domain }}"
      - "grafana.{{ kubernetes_internal_domain }}"
      - "patchmon.{{ kubernetes_internal_domain }}"
- name: Set up /etc/hosts for ansible
  hosts: controlserver
  become: true
  roles:
    - hosts
  vars:
    hosts_dns_server: "@{{ hostvars[groups['dnsserver'][0]].ansible_host }}"
    hosts_entries:
      - "komodo.{{ kubernetes_internal_domain }}"
      - "portainer.{{ kubernetes_internal_domain }}"
      - "portracker.{{ kubernetes_internal_domain }}"
      - "beszel.{{ kubernetes_internal_domain }}"
