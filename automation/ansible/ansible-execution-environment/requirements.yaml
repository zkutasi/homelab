# The collections are capped to majors that still support the ansible-core pin in execution-environment.yaml;
# lift them together with it
collections:
  - name: community.crypto
    type: galaxy
    version: ">=3.0.0,<4.0.0"
  - name: community.docker
    type: galaxy
    version: ">=5.0.0,<6.0.0"
  - name: community.general
    type: galaxy
    version: ">=12.0.0,<13.0.0"
  - name: kubernetes.core
    type: galaxy
    version: ">=6.0.0,<7.0.0"
roles:
  - name: simoncaron.pve_permissions
    version: "1.0.0"
