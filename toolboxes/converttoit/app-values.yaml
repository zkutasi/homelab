image:
  repository: ghcr.io/p2r3/convert
  tag: latest@sha256:2f2f1be26bf28d1fe4975f467dd4006f3e5af9e87485469387008ee989e797b0
  pullPolicy: IfNotPresent

service:
  main:
    enabled: true
    ports:
      main:
        port: 80
        protocol: http
        targetPort: 80

persistence:
  nginx-cache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache/nginx

workload:
  main:
    enabled: true
    type: Deployment
    podSpec:
      containers:
        main:
          enabled: true
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
