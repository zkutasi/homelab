- name: Serve the fixtures
  ansible.builtin.import_playbook: ../../../../../../tests/molecule/package-fixtures.yml
- name: Install what the converge removes
  hosts: all
  gather_subset:
    - min
  tasks:
    - name: Install fake-signed from its signed repository
      ansible.builtin.include_role:
        name: package-install
      vars:
        gpg_dearmor: true
        gpg_project_name: fake-signed
        gpg_key_url: http://127.0.0.1:8080/key.asc
        gpg_signed_repo: "http://127.0.0.1:8080/signed ./"
        packages:
          - fake-signed
    - name: Install fake-plain and fake-extra
      ansible.builtin.include_role:
        name: package-install
      vars:
        apt_add_repo: "deb [trusted=yes] http://127.0.0.1:8080/plain ./"
        packages:
          - fake-plain
          - fake-extra
