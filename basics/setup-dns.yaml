- name: Set up home DNS domain
  hosts: linux-selfmanaged:!dnsserver:!external:!proxmox
  become: true
  tasks:
    - name: Install systemd-resolved
      ansible.builtin.apt:
        name: systemd-resolved
        state: present
      register: resolved_package
    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Configure split DNS routing for .home
      ansible.builtin.template:
        src: all/home-domains.conf.j2
        dest: /etc/systemd/resolved.conf.d/home-domains.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart systemd-resolved

  handlers:
    - name: Restart systemd-resolved
      when: not (ansible_check_mode and resolved_package is changed)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: true

- name: Point the Proxmox node DNS at the home DNS servers
  hosts: proxmox
  vars:
    # Up to two home DNS servers, then the router as the last fallback
    proxmox_dns_servers: "{{ (groups['dnsserver'] | default([]) | map('extract', hostvars, ['ansible_host']) | list)[:2]
      + [ansible_facts['default_ipv4']['gateway']] }}"
    proxmox_dns: "{{ {'search': network_domain} | combine(dict(['dns1', 'dns2', 'dns3'] | zip(proxmox_dns_servers))) }}"
  tasks:
    - name: Read the node DNS settings
      ansible.builtin.command: pvesh get /nodes/{{ ansible_facts['hostname'] }}/dns --output-format json
      register: node_dns
      changed_when: false
      check_mode: false
    - name: Set the node DNS servers
      when: node_dns.stdout | from_json != proxmox_dns
      ansible.builtin.command: >-
        pvesh set /nodes/{{ ansible_facts['hostname'] }}/dns
        {% for key, value in proxmox_dns.items() %} --{{ key }} {{ value }}{% endfor %}
      changed_when: true
