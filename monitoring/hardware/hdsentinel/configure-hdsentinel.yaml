- name: Configure Samba guest share
  hosts: "{{ groups['smart'] | default([]) | difference(groups['synology'] | default([])) }}"
  become: true
  tasks:
    - name: Install some packages for mounting
      ansible.builtin.include_role:
        name: package-install
      vars:
        packages:
          - samba
    - name: Ensure HDSentinel base directory exists
      become: true
      ansible.builtin.file:
        path: "{{ hdsentinel_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Configure Samba
      ansible.builtin.blockinfile:
        path: /etc/samba/smb.conf
        block: |
          [hdsentinel]
              path = {{ hdsentinel_dir }}
              browseable = yes
              read only = yes
              guest ok = yes
              guest only = yes
              force user = nobody
              hosts allow = {{ network_subnet }}
              hosts deny = ALL
        validate: testparm -s %s
      notify: Restart Samba
    - name: Check if Samba is installed
      ansible.builtin.stat:
        path: /usr/sbin/smbd
      register: smbd_bin
    - name: Make sure Samba is enabled and running
      # In check mode the package install above is only simulated, so there is no service yet
      when: smbd_bin.stat.exists or not ansible_check_mode
      ansible.builtin.systemd:
        name: smbd
        enabled: true
        state: started
  handlers:
    - name: Restart Samba
      # In check mode the package install above is only simulated, so there is no service yet
      when: smbd_bin.stat.exists or not ansible_check_mode
      ansible.builtin.systemd_service:
        name: smbd
        state: restarted
- name: Deploy HDSentinel configuration
  hosts: smart
  tasks:
    - name: Install HDSentinel cron job
      become: true
      ansible.builtin.template:
        src: config/templates/hdsentinel.cron.j2
        dest: /etc/cron.d/hdsentinel
        owner: root
        group: root
        mode: '0644'
