- name: Install some python-related packages
  hosts: linux-selfmanaged
  become: true
  roles:
    - package-install
  vars:
    packages:
      - python3-pip
      - pipx
- name: Update pipx by installing pipx in pipx
  hosts: linux-selfmanaged
  tasks:
    - name: Bootstrap pipx
      ansible.builtin.shell:
        cmd: |
          set -e
          python3 -m venv /tmp/bootstrap
          /tmp/bootstrap/bin/pip install pipx
          /tmp/bootstrap/bin/pipx install pipx
          rm -rf /tmp/bootstrap
          "$HOME/.local/bin/pipx" ensurepath
        creates: "{{ ansible_facts['user_dir'] }}/.local/bin/pipx"
- name: Install some pipx packages on controlserver
  hosts: controlserver
  roles:
    - package-install-pipx
  vars:
    pipx_packages:
      - ansible-dev-tools
    pipx_executable: "{{ ansible_user_dir }}/.local/bin/pipx"
