- name: Authenticate to the Beszel central Hub
  ansible.builtin.import_playbook: ../auth-to-central.yaml
- name: Generate dynamic configuration for Beszel
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate configuration file from template
      ansible.builtin.template:
        src: config/templates/app-values-private.yaml.j2
        dest: "app-values-private.yaml"
        mode: "0644"
