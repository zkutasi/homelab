- name: Deploy ddclient as docker
  hosts:
    - external
    - backupserver
  roles:
    - role: docker-compose
      when: ddns_aliases | length > 0
  vars:
    docker_compose_projectname: ddclient
    requested_image_version:
      ddclient: "lscr.io/linuxserver/ddclient:4.0.0"
    docker_compose_template_files_copy:
      - name: config/ddclient.conf
