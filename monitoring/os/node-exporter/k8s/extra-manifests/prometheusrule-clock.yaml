apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-exporter-clock
spec:
  groups:
    - name: clock
      rules:
        - alert: HostClockSkew
          expr: ((node_timex_offset_seconds > 0.05 and deriv(node_timex_offset_seconds[5m]) >= 0) or (node_timex_offset_seconds < -0.05 and deriv(node_timex_offset_seconds[5m]) <= 0))
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Host {{ $labels.host }} clock skew
            description: "Clock skew detected. Clock is out of sync. Ensure NTP is configured correctly on this host."
        - alert: HostClockNotSynchronising
          expr: (min_over_time(node_timex_sync_status[3m]) == 0 and node_timex_maxerror_seconds >= 16)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Host {{ $labels.host }} clock not synchronising
            description: "Clock not synchronising. Ensure NTP is configured on this host."
