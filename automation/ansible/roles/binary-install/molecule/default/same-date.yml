# Run by side_effect.yml: the newer release carries the same file date as the installed one
- name: Update the same-date tool
  hosts: all
  gather_facts: false
  roles:
    - role: binary-install
      vars:
        requested_binary_version: "2.0.0"
        bin_filename: fake-samedate
        download_url: "http://127.0.0.1:8080/fake-samedate/{{ requested_binary_version }}/fake-samedate.tar.gz"
