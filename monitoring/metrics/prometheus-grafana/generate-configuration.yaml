- name: Generate dynamic configuration for Prometheus
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate configuration file from template
      ansible.builtin.template:
        src: config/templates/app-values-private.yaml.j2
        dest: "app-values-private.yaml"
    - name: Make sure extra-manifests directory exists
      ansible.builtin.file:
        path: extra-manifests
        state: directory
        mode: "0755"
    - name: Generate alertmanager-httpproxy from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/alertmanager-httpproxy-private.yaml.j2
        dest: "extra-manifests/alertmanager-httpproxy-private.yaml"
        mode: "0644"
    - name: Generate alertmanager-internal-certificate from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/alertmanager-internal-certificate-private.yaml.j2
        dest: "extra-manifests/alertmanager-internal-certificate-private.yaml"
        mode: "0644"
    - name: Generate grafana-httpproxy from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/grafana-httpproxy-private.yaml.j2
        dest: "extra-manifests/grafana-httpproxy-private.yaml"
        mode: "0644"
    - name: Generate grafana-internal-certificate from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/grafana-internal-certificate-private.yaml.j2
        dest: "extra-manifests/grafana-internal-certificate-private.yaml"
        mode: "0644"
    - name: Generate prometheus-httpproxy from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/prometheus-httpproxy-private.yaml.j2
        dest: "extra-manifests/prometheus-httpproxy-private.yaml"
        mode: "0644"
    - name: Generate prometheus-internal-certificate from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/prometheus-internal-certificate-private.yaml.j2
        dest: "extra-manifests/prometheus-internal-certificate-private.yaml"
        mode: "0644"
