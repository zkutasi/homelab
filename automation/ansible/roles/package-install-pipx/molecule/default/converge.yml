- name: Case a pinned package with a package injected into it
  hosts: all
  gather_subset:
    - min
  # pip installs only the fake packages, from the local folder
  environment:
    PIP_NO_INDEX: "1"
    PIP_FIND_LINKS: /srv/pipx/current
  roles:
    - role: package-install-pipx
      vars:
        pipx_packages:
          - fake-tool==1.0.0
        pipx_inject_packages:
          fake-tool:
            - fake-plugin
