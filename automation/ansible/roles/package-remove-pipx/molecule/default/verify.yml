- name: Verify the package is gone
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the app and its environment
      ansible.builtin.stat:
        path: "{{ item }}"
      register: leftovers
      loop:
        - /root/.local/bin/fake-tool
        - /root/.local/share/pipx/venvs/fake-tool
    - name: Check both are gone
      ansible.builtin.assert:
        that: leftovers.results | selectattr('stat.exists') | list | length == 0
        quiet: true
