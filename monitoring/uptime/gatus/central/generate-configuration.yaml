- name: Generate dynamic configuration for Gatus for K8s services
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Gather Contour HTTPProxy resources
      kubernetes.core.k8s_info:
        api_version: projectcontour.io/v1
        kind: HTTPProxy
      register: contour_proxies
    - name: Filter HTTPProxy resources exposing a virtualhost FQDN
      ansible.builtin.set_fact:
        contour_endpoints: >-
          {{
            contour_proxies.resources
            | selectattr('spec.virtualhost.fqdn', 'defined')
            | list
            | sort(attribute='spec.virtualhost.fqdn')
          }}
    - name: Make sure extra-manifests directory exists
      ansible.builtin.file:
        path: extra-manifests
        state: directory
        mode: "0755"
    - name: Generate httpproxy from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/httpproxy-private.yaml.j2
        dest: "extra-manifests/httpproxy-private.yaml"
        mode: "0644"
    - name: Generate internal-certificate from template
      ansible.builtin.template:
        src: config/templates/extra-manifests/internal-certificate-private.yaml.j2
        dest: "extra-manifests/internal-certificate-private.yaml"
        mode: "0644"
- name: Generate dynamic configuration for Gatus
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate configuration file from template
      ansible.builtin.template:
        src: config/templates/app-values-private.yaml.j2
        dest: "app-values-private.yaml"
