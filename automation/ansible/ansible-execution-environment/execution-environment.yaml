version: 3
dependencies:
  ansible_core:
    package_pip: ansible-core==2.17.14
  ansible_runner:
    package_pip: ansible-runner==2.4.3
  galaxy: requirements.yaml
  # ansible-core is repeated here, so no python dependency can move it off the pin above;
  # ansible-lint and ansible-compat 26.8.0+ exclude ansible-core 2.17. Renovate offers ansible-core 2.18+ and
  # ansible-lint/ansible-compat 26.8.0+: decline them until the ansible-core 2.17 pin is lifted, then move all three together.
  python:
    - ansible-compat==26.6.0
    - ansible-core==2.17.14
    - ansible-lint==26.6.0
    - dnspython==2.9.2
    - jmespath==1.1.0
    - passlib==1.7.4
    - pypsrp==0.9.1
  python_interpreter:
    package_system: "python312"
    python_path: "/usr/bin/python3.12"

images:
  base_image:
    name: ghcr.io/ansible-community/community-ee-base:2.21.5-2@sha256:d42f2597080e8e34ce4d1f70f66f987fc841bd0bbeb680f8d234e94ef1afc60a
