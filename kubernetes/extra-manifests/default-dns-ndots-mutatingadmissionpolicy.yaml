apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: default-dns-ndots
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  matchConditions:
    - name: ndots-not-set
      expression: >
        !has(object.spec.dnsConfig) || !has(object.spec.dnsConfig.options) ||
        !object.spec.dnsConfig.options.exists(o, o.name == 'ndots')
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: "JSONPatch"
      jsonPatch:
        expression: >
          !has(object.spec.dnsConfig) ?
            [JSONPatch{op: "add", path: "/spec/dnsConfig",
                       value: {"options": [{"name": "ndots", "value": "2"}]}}] :
          !has(object.spec.dnsConfig.options) ?
            [JSONPatch{op: "add", path: "/spec/dnsConfig/options",
                       value: [{"name": "ndots", "value": "2"}]}] :
            [JSONPatch{op: "add", path: "/spec/dnsConfig/options/-",
                       value: {"name": "ndots", "value": "2"}}]
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: default-dns-ndots
spec:
  policyName: default-dns-ndots
  matchResources:
