image:
  repository: ghcr.io/vert-sh/vert
  tag: latest@sha256:df3a22efeccf0e37adc3b4d01ecc1bd4ad2bc00ec44dc4672f74b23ba8f3ede9
  pullPolicy: IfNotPresent

persistence:
  nginx-cache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache/nginx

service:
  main:
    enabled: true
    ports:
      main:
        port: 80
        protocol: http
        targetPort: 80

workload:
  main:
    enabled: true
    type: Deployment
    podSpec:
      containers:
        main:
          enabled: true
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
