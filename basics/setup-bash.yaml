- name: Ensure bash_aliases file exists
  hosts: linux
  tasks:
    - name: Ensure bash_aliases file exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        state: touch
        mode: '0644'
        access_time: preserve
        modification_time: preserve
- name: Read .bash_aliases in interactive shells
  hosts: linux
  tasks:
    - name: Read .bash_aliases in interactive shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: '[[ $- == *i* && -f ~/.bash_aliases ]] && . ~/.bash_aliases'
        mode: "0644"
    - name: Define ll like Ubuntu does
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        line: "alias ll='ls -alF'"
        create: true
        mode: "0644"
- name: Set up the dashboard's login shell
  hosts: displayscreen
  tasks:
    - name: Read .profile in login shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: '[ -f ~/.profile ] && . ~/.profile'
        insertbefore: BOF
        create: true
        mode: "0644"
    - name: Start X on the first console
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && startx'
        create: true
        mode: "0644"
- name: Set up OMV's login shell
  hosts: openmediavault
  tasks:
    - name: Read .bashrc in login shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_profile"
        line: '[ -f ~/.bashrc ] && . ~/.bashrc'
        create: true
        mode: "0644"
- name: Set up specific bash configuration for proxmox hosts
  hosts: proxmox
  tasks:
    # Without it, login shells follow root's .profile like on any Debian host
    - name: Remove .bash_profile
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.bash_profile"
        state: absent
