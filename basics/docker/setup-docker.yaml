- name: Setup docker
  hosts: "{{ groups['docker'] | default([]) | difference(groups['synology'] | default([])) }}"
  become: true
  tasks:
    - name: Install some packages
      ansible.builtin.include_role:
        name: package-install
      vars:
        packages:
          - apt-transport-https
          - ca-certificates
          - apparmor
          - apparmor-utils
    - name: Install docker
      ansible.builtin.include_role:
        name: package-install
      vars:
        gpg_dearmor: true
        gpg_project_name: docker-archive-keyring
        gpg_key_url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        gpg_signed_repo: "https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_lsb.codename }} stable"
        packages:
          - docker-ce
    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
    - name: Create Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'
    - name: Prepare docker configuration in daemon.json
      ansible.builtin.template:
        src: config/templates/daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: Restart Docker
  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

- name: Set up sudoless docker usage on Synology
  hosts: synology
  become: true
  environment:
    PATH: "{{ ansible_env.PATH }}:/usr/syno/sbin/"
  tasks:
    - name: Check if 'docker' group already exists
      ansible.builtin.command: /usr/syno/sbin/synogroup --enum all
      register: synogroup_list
      changed_when: false
      check_mode: false
    - name: Ensure docker group exists
      ansible.builtin.command: synogroup --add docker
      register: add_group
      when: "'docker' not in synogroup_list.stdout"
      changed_when: add_group.rc == 0
    - name: Get the members of the docker group
      ansible.builtin.command: synogroup --get docker
      register: docker_group
      changed_when: false
      check_mode: false
      when: "'docker' in synogroup_list.stdout"
    # The members are listed one per line, as 0:[name]
    - name: Add user to docker group
      ansible.builtin.command: synogroup --memberadd docker {{ ansible_user }}
      changed_when: true
      when: docker_group.stdout | default('') is not search('(?m)^[0-9]+:\[' ~ ansible_user ~ '\]$')
    - name: Change ownership of docker socket
      ansible.builtin.file:
        path: /var/run/docker.sock
        owner: root
        group: docker
        state: file
        mode: '0660'
