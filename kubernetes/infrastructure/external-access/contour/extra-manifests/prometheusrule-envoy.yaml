apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy
spec:
  groups:
    - name: envoy
      rules:
        - alert: EnvoyHighDownstreamHTTP5xxErrorRate
          expr: |
            sum by (instance) (rate(envoy_http_downstream_rq_xx{envoy_response_code_class="5"}[5m]))
            /
            sum by (instance) (rate(envoy_http_downstream_rq_completed[5m])) * 100
            > 5 and sum by (instance) (rate(envoy_http_downstream_rq_completed[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Envoy high downstream HTTP 5xx error rate (instance {{ $labels.instance }})
            description: "More than 5% of downstream HTTP responses are 5xx on {{ $labels.instance }}"
        - alert: EnvoyHighClusterUpstream5xxErrorRate
          expr: |
            rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m])
            /
            rate(envoy_cluster_upstream_rq_completed[5m]) * 100
            > 5 and rate(envoy_cluster_upstream_rq_completed[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Envoy high cluster upstream 5xx error rate (instance {{ $labels.instance }})
            description: "More than 5% of upstream requests return 5xx in cluster {{ $labels.envoy_cluster_name }} on {{ $labels.instance }}"
        - alert: EnvoyNoHealthyUpstream
          expr: increase(envoy_cluster_upstream_cx_none_healthy[5m]) > 3
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Envoy no healthy upstream (instance {{ $labels.instance }})
            description: "Upstream connection attempts failed because no healthy upstream was available in cluster {{ $labels.envoy_cluster_name }} on {{ $labels.instance }} ({{ $value }} in the last 5m)"
