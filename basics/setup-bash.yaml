- name: Ensure bash_aliases file exists
  hosts: linux
  tasks:
    - name: Ensure bash_aliases file exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        state: touch
        mode: '0644'
        access_time: preserve
        modification_time: preserve
- name: Read .bash_aliases in interactive shells
  hosts: linux
  tasks:
    - name: Read .bash_aliases in interactive shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: '[[ $- == *i* && -f ~/.bash_aliases ]] && . ~/.bash_aliases'
        mode: "0644"
    - name: Define ll like Ubuntu does
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bash_aliases"
        line: "alias ll='ls -alF'"
        create: true
        mode: "0644"
- name: Set up specific bash configuration for certain hosts
  hosts:
    - openmediavault
    - displayscreen
  tasks:
    - name: Ensure .bash_profile is present
      ansible.builtin.template:
        src: "{{ inventory_hostname }}/bash_profile.j2"
        dest: "{{ ansible_user_dir }}/.bash_profile"
        owner: "{{ ansible_user }}"
        group: "users"
        mode: '0644'
    - name: Ensure .bash_aliases is present
      ansible.builtin.template:
        src: "{{ inventory_hostname }}/bash_aliases.j2"
        dest: "{{ ansible_user_dir }}/.bash_aliases"
        owner: "{{ ansible_user }}"
        group: "users"
        mode: '0644'
- name: Set up specific bash configuration for proxmox hosts
  hosts: proxmox
  tasks:
    - name: Ensure .bash_profile is present
      ansible.builtin.template:
        src: "proxmox/bash_profile.j2"
        dest: "{{ ansible_user_dir }}/.bash_profile"
        owner: "{{ ansible_user }}"
