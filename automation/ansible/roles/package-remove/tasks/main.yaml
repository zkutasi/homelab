- name: Print the package manager
  ansible.builtin.debug:
    msg: System {{ inventory_hostname }} has package manager {{ ansible_pkg_mgr }}
- name: Remove the requested packages
  become: true
  when: ansible_pkg_mgr == 'apt'
  block:
    - name: Remove packages
      when: ansible_pkg_mgr != 'unknown'
      ansible.builtin.package:
        name: "{{ item }}"
        state: absent
      loop: "{{ packages }}"
    - name: Remove the APT repository and its GPG key
      when: gpg_dearmor
      block:
        - name: Remove the repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by={{ gpg_key_path }}] {{ gpg_signed_repo }}"
            state: absent
            update_cache: true
        - name: Remove the GPG key
          ansible.builtin.file:
            path: "{{ gpg_key_path }}"
            state: absent
