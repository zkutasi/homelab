repos:
  - repo: local
    hooks:
      - id: sops-up-to-date
        name: Ensure SOPS-encrypted secrets are up-to-date
        entry: security/secret-mgmt/age-sops/sops.sh --decrypt-all
        language: script
        always_run: true
        pass_filenames: false
      - id: ca-key-symlink-only
        name: Allow ca.key only as a symlink
        entry: "bash -c 'for f in \"$@\"; do [ -L \"$f\" ] || { echo \"ERROR: $f is a real key, only symlinks are allowed\"; exit 1; }; done' --"
        language: system
        files: (^|/)ca\.key$
      - id: bats
        name: Run the bats tests that cover the changed files
        entry: tests/run.sh --changed
        language: script
        require_serial: true
        files: (\.(sh|bash|bats)$|^tests/)
        stages: [manual]
      - id: render
        name: Render and check the Docker Apps whose files changed
        entry: tests/run.sh --render --changed
        language: script
        require_serial: true
        files: (^tests/render/|/docker-compose\.yaml\.j2$|/deploy-[^/]*\.yaml$|/config/templates/|^automation/ansible/roles/docker-compose/|^ansible\.cfg$)
        stages: [manual]
      - id: render-k8s
        name: Generate, render and validate the Kubernetes Apps whose files changed
        entry: tests/run.sh --render-k8s --changed
        language: script
        require_serial: true
        files: (^tests/render/|^common-[^/]*\.sh$|/deploy-k8s\.sh$|/app-values[^/]*\.yaml$|/extra-manifests/|/config/templates/|/chart/|/kustomization\.yaml$|/generate-configuration\.yaml$|^ansible\.cfg$|^kubernetes/k8s-install/kubespray/run-upgrade\.sh$)
        stages: [manual]
      - id: renovate-extract
        name: Check that Renovate still extracts the fixtures
        entry: tests/run.sh --renovate
        language: script
        pass_filenames: false
        files: ^(renovate\.json|tests/renovate/)
        stages: [manual]
      - id: ansible-lint
        name: Run ansible-lint in the execution environment (about 5 minutes)
        entry: tests/run.sh --lint
        language: script
        pass_filenames: false
        always_run: true
        stages: [manual]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
  - repo: https://github.com/crate-ci/typos
    rev: v1.36.2
    hooks:
      - id: typos
        args: ["--force-exclude", "."]
        pass_filenames: false
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2-docker
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks-docker
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        types: [file]
        files: (\.(sh|bash|bats)$|^tests/bats/stubs/)
        exclude: ^(_templates|tests/renovate/fixtures)/
