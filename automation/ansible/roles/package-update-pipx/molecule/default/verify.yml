- name: Verify the version after the update
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the app
      ansible.builtin.command:
        cmd: /home/tester/.local/bin/fake-tool
      register: app
      changed_when: false
    # upgrade-all doesn't keep the version the package was installed with (backlog 259)
    - name: Check the newer version
      ansible.builtin.assert:
        that: app.stdout == "2.0.0"
        quiet: true
