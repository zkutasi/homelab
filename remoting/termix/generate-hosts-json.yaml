- name: Generate Termix JSON from inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Generate Termix hosts JSON
      ansible.builtin.template:
        src: config/templates/termix_hosts.json.j2
        dest: termix_hosts.json
        mode: "0644"
      vars:
        all_hosts: "{{ groups['all'] }}"
