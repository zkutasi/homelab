- name: Verify the pinned package and the injected one
  hosts: all
  gather_facts: false
  tasks:
    - name: Run the app
      ansible.builtin.command:
        cmd: /home/tester/.local/bin/fake-tool
      register: app
      changed_when: false
    - name: Import the injected package in the app's environment
      ansible.builtin.command:
        cmd: /home/tester/.local/share/pipx/venvs/fake-tool/bin/python -c 'import fake_plugin'
      changed_when: false
    - name: Check the pinned version
      ansible.builtin.assert:
        that: app.stdout == "1.0.0"
        quiet: true
