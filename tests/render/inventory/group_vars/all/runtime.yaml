# The live HTTPProxies the Gatus and Uptime Kuma generate playbooks and the dashboard playbooks query from the cluster,
# filtered to those with a virtualhost: one App checked at its root URL, one with its own health endpoint, and one
# without annotations, which Kubernetes then leaves out of its metadata
contour_endpoints:
  - metadata:
      name: app01
      annotations: {}
    spec:
      virtualhost:
        fqdn: app01.kubernetes.example
  - metadata:
      name: app02
      annotations:
        homelab/health-endpoint: /health
    spec:
      virtualhost:
        fqdn: app02.kubernetes.example
  - metadata:
      name: app03
    spec:
      virtualhost:
        fqdn: app03.kubernetes.example
