- name: Give a second user an RSA key already
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create the user
      ansible.builtin.user:
        name: bob
        shell: /bin/bash
    - name: Create the key
      ansible.builtin.command:
        cmd: runuser -u bob -- ssh-keygen -q -t rsa -b 2048 -N '' -f /home/bob/.ssh/id_rsa
        creates: /home/bob/.ssh/id_rsa
