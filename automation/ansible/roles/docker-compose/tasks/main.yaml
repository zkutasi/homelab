- name: Create the docker-compose directory if it does not exist
  ansible.builtin.file:
    path: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}"
    state: directory
    mode: '0755'
- name: Create bind mount directories
  ansible.builtin.file:
    path: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}/{{ item.name }}"
    state: directory
    mode: "{{ item.folder_mode | default('0755') }}"
    owner: "{{ item.owner | default(docker_compose_files_owner) }}"
    group: "{{ item.group | default(docker_compose_files_group) }}"
  loop: "{{ docker_compose_create_dirs }}"
  ignore_errors: true
  register: ignore_errors_register
  become: "{{ item.owner is defined or item.group is defined }}"
- name: Copy any static files necessary
  ansible.builtin.copy:
    src: "{{ docker_compose_source_basepath }}/config/static/{{ item.name }}/"   # Note the / at the end !
    dest: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}/{{ item.name }}"
    mode: "{{ item.file_mode | default('0644') }}"
    owner: "{{ item.owner | default(docker_compose_files_owner) }}"
    group: "{{ item.group | default(docker_compose_files_group) }}"
    directory_mode: "{{ item.folder_mode | default('0755') }}"
  loop: "{{ docker_compose_static_files_copy }}"
  notify:
    - Restart the docker service
- name: Make sure destination dir exists for template files
  ansible.builtin.file:
    path: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}/{{ item.name | dirname }}"
    state: directory
    mode: "{{ item.folder_mode | default('0755') }}"
    owner: "{{ item.owner | default(docker_compose_files_owner) }}"
    group: "{{ item.group | default(docker_compose_files_group) }}"
  loop: "{{ docker_compose_template_files_copy }}"
- name: Copy any template files necessary
  ansible.builtin.template:
    src: "{{ docker_compose_source_basepath }}/config/templates/{{ item.name }}.j2"
    dest: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}/{{ item.name }}"
    mode: "{{ item.file_mode | default('0644') }}"
    owner: "{{ item.owner | default(docker_compose_files_owner) }}"
    group: "{{ item.group | default(docker_compose_files_group) }}"
    follow: true
  loop: "{{ docker_compose_template_files_copy }}"
  notify:
    - Restart the docker service
- name: Copy docker compose file
  ansible.builtin.template:
    src: "{{ docker_compose_source_basepath }}/docker-compose.yaml.j2"
    dest: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}/docker-compose.yaml"
    mode: "0644"
    owner: "{{ docker_compose_files_owner }}"
    group: "{{ docker_compose_files_group }}"
  notify:
    - Restart the docker service
- name: Get the version of docker compose
  check_mode: false
  environment:
    PATH: "{{ (path_extension_list | default([]) + [lookup('env', 'PATH')]) | join(':') }}"
  block:
    - name: Check the version of docker compose
      ansible.builtin.command:
        cmd: "docker compose version"
      register: docker_compose_version_output
      changed_when: false
    - name: Extract exact version
      ansible.builtin.set_fact:
        docker_compose_installed_version: "{{ docker_compose_version_output.stdout_lines[0]
          | regex_search('Docker Compose version v?([0-9\\.]*)', '\\1') | first }}"
    - name: Print out the docker compose version
      ansible.builtin.debug:
        var: docker_compose_installed_version
- name: Gather docker compose stack state
  become: "{{ docker_with_sudo }}"
  check_mode: false
  environment:
    PATH: "{{ (path_extension_list | default([]) + [lookup('env', 'PATH')]) | join(':') }}"
  ansible.builtin.command:
    cmd: "{{ docker_cli_path }} compose ps --status running --quiet"
    chdir: "{{ docker_compose_rootdir }}/{{ docker_compose_projectname }}"
  register: compose_running
  changed_when: false
  failed_when: compose_running.rc | default(1) != 0 and not ansible_check_mode
- name: Trigger docker restart if stack is down
  ansible.builtin.debug:
    msg: "Docker compose stack has no running containers"
  changed_when: true
  when: >
    compose_running.stdout_lines | default([]) | length == 0
  notify:
    - Restart the docker service
